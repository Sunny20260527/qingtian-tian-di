<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>晴天小天地</title>
<style>
body { 
    background-color: #f4f5f7; 
    margin: 0; 
    padding: 0;
    font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,Microsoft Yahei,sans-serif;
}
.top-banner{
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, #ff7b9c, #ffb6c1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    color:#fff;
    font-weight:500;
    letter-spacing:2px;
}
.container{
    max-width: 1200px;
    margin: 20px auto;
    display: flow-root;
}
.left { width: 65%; float: left; }
.right { width: 30%; float: right; }

.wb { 
    background: #ffffff; 
    padding: 24px; 
    border-radius: 14px; 
    margin-bottom: 20px; 
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    position:relative;
}
.card-opt{
    position:absolute;
    top:15px;
    right:15px;
    display:flex;
    gap:10px;
}
.opt-btn{
    font-size:12px;
    color:#999;
    cursor:pointer;
}
.opt-btn:hover{
    color:#e6162d;
}
.info { 
    background: #ffffff; 
    padding: 24px; 
    border-radius: 14px; 
    margin-bottom: 20px; 
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    text-align:center;
}
.avatar-box{
    margin-bottom:15px;
}
#avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ffb6c1;
    cursor:pointer;
    background:#ffd1dc;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    color:#fff;
}
#avatarInput{
    display:none;
}
.wb strong {
    font-size: 17px;
    color: #e6162d;
    font-weight: 600;
}
.wb .time {
    color: #999;
    font-size: 12px;
    margin-left: 10px;
}
.wb p {
    color: #333;
    line-height: 1.8;
    font-size: 15px;
    margin: 16px 0;
}
.bottom {
    font-size: 13px;
    display: flex;
    gap:20px;
}
.bottom span{
    cursor:pointer;
    color:#e6162d;
}
.bottom span.grey{
    color:#999;
}
.info h4 {
    margin-top: 0;
    color: #333;
    border-left: none;
    padding-left: 0;
    font-size: 16px;
}
.info p {
    color: #555;
    font-size: 14px;
    margin: 12px 0;
}

.follow-btn {
    background-color: #e6162d;
    color: white;
    border: none;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    margin-top:8px;
}
.follow-btn.followed {
    background-color: #eee;
    color:#666;
}
/* 带进度条的音乐播放器 */
.music-card{
    background:#fff8fa;
    border-radius:12px;
    padding:16px;
    margin-top:10px;
    text-align:left;
}
.music-title{
    font-size:14px;
    color:#e6162d;
    font-weight:bold;
    margin-bottom:8px;
}
.music-desc{
    font-size:13px;
    color:#666;
    margin:4px 0;
}
.music-control{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:12px;
}
.music-btn{
    background:#ff7b9c;
    color:#fff;
    border:none;
    border-radius:20px;
    padding:6px 14px;
    cursor:pointer;
    font-size:14px;
}
/* 进度条样式 */
.progress-wrap{
    width:100%;
    height:6px;
    background:#f0d8e0;
    border-radius:99px;
    margin-top:12px;
    position:relative;
    cursor:pointer;
}
.progress-bar{
    height:6px;
    background:#ff7b9c;
    border-radius:99px;
    width:0%;
}
.progress-dot{
    width:12px;
    height:12px;
    background:#ff7b9c;
    border-radius:50%;
    position:absolute;
    top:-3px;
    left:0%;
    transform:translate(-50%,0);
}
.leave-box{
    margin-top:15px;
    padding:15px;
    background:#fafafa;
    border-radius:12px;
}
textarea,input[type="text"]{
    width:100%;
    height:70px;
    margin-bottom:10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}
input[type="text"]{
    height:42px;
}
.send-btn{
    background:#e6162d;
    color:white;
    border:none;
    padding:8px 18px;
    border-radius:20px;
    cursor:pointer;
}
.msg-item{
    margin:6px 0;
    padding:8px;
    background:#fff;
    border-radius:6px;
    font-size:13px;
}
.more-btn{
    margin-top:8px;
    color:#e6162d;
    cursor:pointer;
    font-size:13px;
}
.add-card-box{
    background:#fff;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
}
.add-card-box textarea{
    height:100px;
}
video,audio{
    width:100%;
    border-radius:8px;
    margin:10px 0;
}
.page-box{
    text-align:center;
    margin:20px 0;
}
.page-btn{
    padding:6px 12px;
    margin:0 4px;
    border:1px solid #e6162d;
    color:#e6162d;
    background:#fff;
    border-radius:6px;
    cursor:pointer;
}
.page-btn.active{
    background:#e6162d;
    color:#fff;
}
.page-btn:disabled{
    border-color:#ccc;
    color:#ccc;
    cursor:not-allowed;
}
</style>
</head>
<body>

<div class="top-banner">晴天小天地 · 温柔自留地</div>

<div class="container">
    <div class="left">
        <div class="add-card-box">
            <h4>发布新动态（外网通用版）</h4>
            <textarea id="newCardText" placeholder="写下说明文字..."></textarea>
            <input type="text" id="videoUrl" placeholder="粘贴视频网络链接（无视频留空）">
            <input type="text" id="audioUrl" placeholder="粘贴音频网络链接（无音频留空）">
            <button class="send-btn" onclick="addNewCard()">发布动态卡片</button>
        </div>

        <div id="cardList"></div>
        <div class="page-box" id="pageBox"></div>
    </div>

    <div class="right">
        <div class="info">
            <div class="avatar-box">
                <div id="avatar">晴</div>
                <input type="file" id="avatarInput" accept="image/*">
            </div>
            <h4>个人信息</h4>
            <p>昵称：晴天</p>
            <p>微信ID：Natalia_tn</p>
            <p>签名：一生所爱，温柔自由</p>
            <button class="follow-btn" id="followBtn" onclick="changeFollow()">+ 加关注</button>
        </div>
        <div class="info">
            <h4>背景音乐</h4>
            <div class="music-card">
                <div class="music-title">🎵 专属背景音乐</div>
                <div class="music-desc">歌曲：一生所爱</div>
                <div class="music-desc">歌手：卢冠廷</div>
                <div class="music-control">
                    <button class="music-btn" id="musicBtn">▶ 点击播放</button>
                </div>
                <!-- 进度条 -->
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-dot" id="progressDot"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<audio id="bgMusic" preload="none">
    <source src="https://music.163.com/song/media/outer/url?id=393703.mp3" type="audio/mpeg">

<script>
// 头像上传逻辑
const avatar = document.getElementById('avatar');
const avatarInput = document.getElementById('avatarInput');
const savedAvatar = localStorage.getItem('userAvatar');
if(savedAvatar){
    avatar.style.backgroundImage = `url(${savedAvatar})`;
    avatar.style.backgroundSize = "cover";
    avatar.innerText = "";
}
avatar.onclick = ()=>avatarInput.click();
avatarInput.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(event){
        avatar.style.backgroundImage = `url(${event.target.result})`;
        avatar.style.backgroundSize = "cover";
        avatar.innerText = "";
        localStorage.setItem('userAvatar', event.target.result);
    }
    reader.readAsDataURL(file);
};

// 音乐 + 进度条
const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressDot = document.getElementById("progressDot");

// 播放/暂停
musicBtn.onclick = function(){
    if(music.paused){
        music.play();
        musicBtn.innerText = "⏸ 点击暂停";
    }else{
        music.pause();
        musicBtn.innerText = "▶ 点击播放";
    }
};

// 进度实时更新
music.ontimeupdate = function(){
    let percent = (music.currentTime / music.duration) * 100;
    progressBar.style.width = percent + "%";
    progressDot.style.left = percent + "%";
};

// 点击进度条跳转
progressWrap.onclick = function(e){
    let rect = progressWrap.getBoundingClientRect();
    let pos = (e.clientX - rect.left) / rect.width;
    music.currentTime = pos * music.duration;
};

const PAGE_SIZE = 5;
let currentPage = 1;
let cardList = [];
let cardId = 1;

let followCount = parseInt(localStorage.getItem('followCount')) || 18;
let isUserFollowed = localStorage.getItem('isUserFollowed') === 'true';
const followBtn = document.getElementById("followBtn");
if(isUserFollowed){
    followBtn.innerText = `已关注 (${followCount})`;
    followBtn.classList.add("followed");
}

cardList.push({
    id:1,
    user:"晴天",
    time:"今天 14:20",
    content:"从前现在过去了再不来，<br>红红落叶长埋尘土内。<br>一生所爱，止于岁月。",
    video:"",
    audio:""
});

function addNewCard(){
    let text = document.getElementById("newCardText").value.trim();
    let videoUrl = document.getElementById("videoUrl").value.trim();
    let audioUrl = document.getElementById("audioUrl").value.trim();
    if(!text && !videoUrl && !audioUrl){
        return alert("请填写文字或粘贴音视频网络链接");
    }
    cardId++;
    let now = new Date();
    let timeStr = `今天 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    cardList.unshift({
        id:cardId,
        user:"晴天",
        time:timeStr,
        content:text.replace(/\n/g,"<br>"),
        video:videoUrl,
        audio:audioUrl
    });
    document.getElementById("newCardText").value = "";
    document.getElementById("videoUrl").value = "";
    document.getElementById("audioUrl").value = "";
    renderPage();
}

function deleteCard(id){
    if(!confirm("确定要删除这条动态吗？删除后不可恢复")) return;
    cardList = cardList.filter(item=>item.id!==id);
    localStorage.removeItem("likeCount"+id);
    localStorage.removeItem("isUserLiked"+id);
    localStorage.removeItem("shareCount"+id);
    localStorage.removeItem("msgCount"+id);
    localStorage.removeItem("msgList"+id);
    renderPage();
}

function editCard(id){
    let item = cardList.find(x=>x.id===id);
    let raw = item.content.replace(/<br>/g,"\n");
    let newText = prompt("修改说明文字：",raw);
    if(newText===null) return;
    if(!newText.trim()) return alert("内容不能为空");
    item.content = newText.replace(/\n/g,"<br>");
    renderPage();
}

function renderPage(){
    const total = cardList.length;
    const totalPage = Math.ceil(total / PAGE_SIZE);
    if(currentPage > totalPage && totalPage>0) currentPage = totalPage;
    const start = (currentPage-1)*PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageCards = cardList.slice(start,end);
    const container = document.getElementById("cardList");
    container.innerHTML = "";
    pageCards.forEach(item=>{
        const div = document.createElement("div");
        div.className = "wb";
        div.id = "card"+item.id;
        let mediaHtml = "";
        if(item.video) mediaHtml += `<video controls src="${item.video}"></video>`;
        if(item.audio) mediaHtml += `<audio controls src="${item.audio}">`;
        div.innerHTML = `
            <div class="card-opt">
                <span class="opt-btn" onclick="editCard(${item.id})">编辑</span>
                <span class="opt-btn" onclick="deleteCard(${item.id})">删除</span>
            </div>
            <strong>${item.user}</strong>
            <span class="time">${item.time}</span>
            ${mediaHtml}
            <p>${item.content}</p>
            <div class="bottom">
                <span id="shareSpan${item.id}" onclick="shareLink(${item.id})">转发 <span id="shareNum${item.id}">23</span></span>
                <span id="msgSpan${item.id}" onclick="openMsgBox(${item.id})">留言 <span id="msgNum${item.id}">45</span></span>
                <span id="likeSpan${item.id}" onclick="addLike(${item.id})">点赞 <span id="likeNum${item.id}">128</span></span>
            </div>
            <div class="leave-box">
                <textarea id="msgInput${item.id}" placeholder="写下你的留言..."></textarea>
                <button class="send-btn" onclick="submitMsg(${item.id})">提交留言并发送给微信</button>
                <div id="msgList${item.id}" style="max-height:420px;overflow-y:auto;"></div>
                <div class="more-btn" id="moreBtn${item.id}" onclick="toggleMoreMsg(${item.id})">展开更多留言</div>
            </div>
        `;
        container.appendChild(div);
        renderMsg(item.id,3);
    });
    const pageBox = document.getElementById("pageBox");
    pageBox.innerHTML = "";
    if(totalPage <=1) return;
    let prev = document.createElement("button");
    prev.className = "page-btn";
    prev.innerText = "上一页";
    prev.disabled = currentPage===1;
    prev.onclick = ()=>{ currentPage--; renderPage(); };
    pageBox.appendChild(prev);
    for(let i=1;i<=totalPage;i++){
        let btn = document.createElement("button");
        btn.className = "page-btn"+(i===currentPage?" active":"");
        btn.innerText = i;
        btn.onclick = ()=>{ currentPage=i; renderPage(); };
        pageBox.appendChild(btn);
    }
    let next = document.createElement("button");
    next.className = "page-btn";
    next.innerText = "下一页";
    next.disabled = currentPage===totalPage;
    next.onclick = ()=>{ currentPage++; renderPage(); };
    pageBox.appendChild(next);
}

function changeFollow(){
    if(isUserFollowed){
        followCount--;
        isUserFollowed = false;
        followBtn.innerText = "+ 加关注";
        followBtn.classList.remove("followed");
    }else{
        followCount++;
        isUserFollowed = true;
        followBtn.innerText = `已关注 (${followCount})`;
        followBtn.classList.add("followed");
        alert("感谢关注！可添加微信：Natalia_tn");
    }
    localStorage.setItem('followCount', followCount);
    localStorage.setItem('isUserFollowed', isUserFollowed);
}

function addLike(id){
    let keyLike = "likeCount"+id;
    let keyLiked = "isUserLiked"+id;
    let likeCount = parseInt(localStorage.getItem(keyLike)) || 128;
    let isUserLiked = localStorage.getItem(keyLiked) === 'true';
    let span = document.getElementById("likeSpan"+id);
    let num = document.getElementById("likeNum"+id);
    if(isUserLiked){
        likeCount--;
        isUserLiked = false;
        span.classList.remove("grey");
    }else{
        likeCount++;
        isUserLiked = true;
        span.classList.add("grey");
    }
    num.innerText = likeCount;
    localStorage.setItem(keyLike, likeCount);
    localStorage.setItem(keyLiked, isUserLiked);
}

function shareLink(id){
    let keyShare = "shareCount"+id;
    let shareCount = parseInt(localStorage.getItem(keyShare)) || 23;
    shareCount++;
    document.getElementById("shareNum"+id).innerText = shareCount;
    localStorage.setItem(keyShare, shareCount);
    navigator.clipboard.writeText(window.location.href);
    alert("链接已复制，可粘贴到朋友圈、抖音分享");
}

function submitMsg(id){
    let val = document.getElementById("msgInput"+id).value.trim();
    if(!val) return alert("请输入留言内容");
    let keyMsg = "msgCount"+id;
    let keyMsgList = "msgList"+id;
    let msgCount = parseInt(localStorage.getItem(keyMsg)) || 45;
    let msgList = JSON.parse(localStorage.getItem(keyMsgList)) || [];
    msgCount++;
    msgList.unshift(val);
    localStorage.setItem(keyMsg, msgCount);
    localStorage.setItem(keyMsgList, JSON.stringify(msgList));
    document.getElementById("msgNum"+id).innerText = msgCount;
    renderMsg(id,3);
    document.getElementById("moreBtn"+id).innerText = "展开更多留言";
    navigator.clipboard.writeText("新留言："+val+" 微信：Natalia_tn");
    alert("留言已提交，内容已复制！直接粘贴发给微信：Natalia_tn 即可");
    document.getElementById("msgInput"+id).value = "";
}

function renderMsg(id,max=3){
    let keyMsgList = "msgList"+id;
    let msgList = JSON.parse(localStorage.getItem(keyMsgList)) || [];
    let listDom = document.getElementById("msgList"+id);
    listDom.innerHTML = "";
    let showList = msgList.slice(0,max);
    showList.forEach(item=>{
        let div = document.createElement("div");
        div.className = "msg-item";
        div.innerText = "用户留言："+item;
        listDom.appendChild(div);
    })
}

function toggleMoreMsg(id){
    let btn = document.getElementById("moreBtn"+id);
    if(btn.innerText === "展开更多留言"){
        renderMsg(id,15);
        btn.innerText = "收起留言";
    }else{
        renderMsg(id,3);
        btn.innerText = "展开更多留言";
    }
}

function openMsgBox(id){
    document.getElementById("msgInput"+id).focus();
}

renderPage();
</script>

</body>
</html>
